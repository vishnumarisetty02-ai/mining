[project]
name = "geomine"
version = "0.1.0"
description = "GeoMine Intelligence & Reporting Platform for CMPDI and Coal India subsidiaries"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "GeoMine Team" },
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pgvector>=0.3,<1",
    "redis>=5.0,<6",
    "arq>=0.26,<1",
    "boto3>=1.35,<2",
    "httpx>=0.27,<1",
    "pdfplumber>=0.11,<1",
    "pdf2image>=1.17,<2",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "rapidfuzz>=3.9,<4",
    "pint>=0.24,<1",
    "python-multipart>=0.0.12",
    "structlog>=24.4,<25",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27,<2",
    "prometheus-client>=0.21,<1",
    "jsonschema>=4.23,<5",
]

[dependency-groups]
dev = [
    "ruff>=0.7,<1",
    "mypy>=1.12,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5.0,<6",
    "hypothesis>=6.112,<7",
    "httpx>=0.27,<1",
    "respx>=0.21,<1",
    "factory-boy>=3.3,<4",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/core_models",
    "packages/consistency_firewall",
    "packages/document_ai",
    "packages/llm_gateway",
    "services",
]

# ── Ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "services", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "S", "B", "A", "C4",
    "DTZ", "T20", "ICN", "PIE", "PT", "RSE", "RET", "SIM",
    "TCH", "ARG", "ERA", "PL", "TRY", "FLY", "PERF", "RUF",
]
ignore = ["S101", "TRY003", "PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["geomine", "core_models", "consistency_firewall", "document_ai", "llm_gateway"]

# ── Mypy ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pdf2image.*", "paddleocr.*", "cv2.*", "arq.*", "pgvector.*"]
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests that require external services",
    "property: hypothesis property-based tests",
    "contract: API contract tests with schemathesis",
]
addopts = "-ra --strict-markers --tb=short"

# ── Coverage ──────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["packages", "services"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
    "@overload",
]
